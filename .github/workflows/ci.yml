name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验(硬卡 200 个、slug 唯一、字段齐全)
        run: node build/validate.mjs
      - name: 构建标准 Skill 与兼容适配产物
        run: node build/build.mjs
      - name: 功能与安装安全回归
        run: node --test tests/*.test.mjs
      - name: Agent Skills 官方规范校验
        run: |
          python -m pip install 'git+https://github.com/agentskills/agentskills@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref'
          skills-ref validate dist/agent-skills/200-agent
