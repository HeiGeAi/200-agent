name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验(硬卡 200 个、slug 唯一、字段齐全)
        run: node build/validate.mjs
      - name: 构建标准 Skill 与兼容适配产物
        run: node build/build.mjs
      - name: 守门:已提交产物与源文件无漂移
        run: git diff --exit-code -- catalog.json ROUTER.md README.md README.en.md
      - name: 功能与安装安全回归
        run: node --test tests/*.test.mjs
      - name: Agent Skills 官方规范校验
        # 信任边界:主包已 pin 到 commit 38a2ff8;但 pip 仍会按 PyPI 最新版解析其传递依赖。
        # 被投毒的前提是 agentskills 仓库或其依赖链失陷,概率低,暂不启用哈希锁定;上游提供锁文件后再收紧。
        run: |
          python -m pip install 'git+https://github.com/agentskills/agentskills@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref'
          skills-ref validate dist/agent-skills/200-agent
